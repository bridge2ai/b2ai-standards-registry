name: "Run script to update synapse tables"

on:
  push:
    branches:
      - main
    paths:
      - 'project/data/*.json'
      - 'scripts/publishing/**'
      - 'utils/id_linking.py'
  # D4D_content is published from another repo; this moves mv_D4D_content (and
  # rebuilds DataSet/Organization_denormalized, which join it) when it changes.
  # Unchanged tables are skipped, so a run with nothing new writes nothing.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Runs must not clear and refill the same tables at once
concurrency:
  group: synapse-publish
  cancel-in-progress: false

jobs:
  update_synapse_tables:
    name: Run script to update synapse tables with data changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        # uses: snok/install-poetry@v1.3.1
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --extras synapse

      - name: Publish changed tables and update materialized views
        run: poetry run b2aisr publish-synapse
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
